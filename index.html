<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0d">
<title>FIREFIT ELITE 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0d;--surf:#181818;--card:#1f1f1f;--border:#2c2c2c;
  --txt:#efefef;--muted:#666;--sub:#999;
  --fire:#E8421A;--gold:#F5A623;--green:#3d9142;
  --blue:#2F6FBF;--purple:#6B4FBB;
  --r: 10px;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;overflow-x:hidden}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
.hdr{position:sticky;top:0;z-index:99;background:rgba(13,13,13,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:10px 14px 0}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;background:linear-gradient(90deg,var(--fire),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat{font-size:11px;color:var(--muted);letter-spacing:.3px}
.stat b{color:var(--fire);font-weight:600}

/* WEEK PILLS */
.wpills{display:flex;gap:5px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.wpills::-webkit-scrollbar{display:none}
.wp{flex-shrink:0;padding:5px 11px;border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);background:transparent;white-space:nowrap;transition:all .15s;font-family:'DM Sans',sans-serif}
.wp.on{color:#fff;border-color:transparent}
.wp.on.normal{background:var(--fire)}
.wp.on.deload{background:var(--purple)}
.wp.on.taper{background:var(--blue)}
.wp.deload{border-color:#6B4FBB44}
.wp.taper{border-color:#2F6FBF44}

/* PROGRESS */
.pgbar-wrap{padding:0 14px 0}
.pgbar{height:2px;background:var(--border);border-radius:1px;overflow:hidden;margin-bottom:3px}
.pgfill{height:100%;background:linear-gradient(90deg,var(--fire),var(--gold));border-radius:1px;transition:width .4s}
.pglbl{font-size:10px;color:var(--muted);text-align:right;padding-bottom:8px}

/* WEEK HEADER */
.wk-hdr{padding:14px 14px 6px}
.wk-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:7px}
.wk-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;line-height:1.15;margin-bottom:3px}
.wk-sub{font-size:12px;color:var(--sub)}

/* DAY TABS */
.dtabs{display:flex;overflow-x:auto;padding:0 14px;border-bottom:1px solid var(--border);scrollbar-width:none;gap:2px}
.dtabs::-webkit-scrollbar{display:none}
.dt{flex-shrink:0;padding:7px 10px 9px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;position:relative;top:1px;white-space:nowrap;transition:all .13s}
.dt.on{color:var(--txt);border-bottom-color:var(--fire)}
.dt.rest{color:#333}
.dt.done::after{content:"✓";font-size:9px;color:var(--green);margin-left:2px;vertical-align:super}

/* BODY */
.body{padding:12px 14px 90px;flex:1}

/* TYPE BANNER */
.typebanner{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:var(--r);margin-bottom:10px;border-left:3px solid}
.tb-icon{font-size:17px}
.tb-txt{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.8px}

/* ACCORDION CARD */
.acard{background:var(--card);border-radius:var(--r);margin-bottom:8px;border:1px solid var(--border);overflow:hidden}
.acard-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;cursor:pointer;user-select:none}
.acard-lbl{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--sub)}
.acard-lbl span{font-size:13px}
.chev{font-size:10px;color:var(--muted);transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.acard-body{padding:0 13px 13px;border-top:1px solid var(--border);display:none}
.acard-body.open{display:block}

/* EXERCISES */
.exlist{display:flex;flex-direction:column;gap:9px;padding-top:11px}
.exrow{display:flex;gap:8px;align-items:flex-start}
.exltr{font-family:'Bebas Neue',sans-serif;font-size:15px;min-width:18px;flex-shrink:0;margin-top:1px}
.extxt{font-size:13.5px;line-height:1.65;color:var(--txt);flex:1}
.ex-hl{background:rgba(232,66,26,.1);border-left:2.5px solid var(--fire);border-radius:5px;padding:7px 10px;font-size:13.5px;line-height:1.65;flex:1;font-weight:500}
.ex-green{background:rgba(61,145,66,.1);border-left:2.5px solid var(--green);border-radius:5px;padding:7px 10px;font-size:13.5px;line-height:1.65;flex:1}
.ex-cf{background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.7;color:#e0c060;width:100%;margin-top:4px}
.ex-hiit{background:rgba(47,111,191,.1);border:1px solid rgba(47,111,191,.3);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.7;color:#90b8e8;width:100%;margin-top:4px}

/* RPE */
.rpelist{display:flex;flex-direction:column;gap:5px;padding-top:10px}
.rperow{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.55;color:var(--sub)}
.rpeltr{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--muted);min-width:18px;flex-shrink:0;margin-top:1px}
.rp{display:inline-flex;align-items:center;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:700;margin:0 2px}
.rp10{background:#3d0f0f;color:#f87171}
.rp9{background:#3d1f0a;color:#fb923c}
.rp8{background:#2d2a00;color:#fbbf24}
.rp7{background:#0f2d10;color:#4ade80}
.rplo{background:#1e1e1e;color:var(--muted)}

/* SIMPLE TEXT */
.stxt{padding-top:10px;font-size:13.5px;line-height:1.7;color:var(--sub)}

/* REST / COMP */
.restday{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:55px 20px;text-align:center}
.rest-ico{font-size:44px;margin-bottom:12px}
.rest-t{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.rest-s{font-size:13px;color:#333;line-height:1.6}
.compcard{background:rgba(245,166,35,.07);border:1px solid rgba(245,166,35,.25);border-radius:var(--r);padding:16px;margin-bottom:10px}
.comp-t{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;color:var(--gold);margin-bottom:8px}

/* DONE BUTTON */
.done-btn{margin-top:10px;width:100%;padding:13px;background:transparent;border:1px solid var(--border);border-radius:var(--r);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px;font-family:'DM Sans',sans-serif}
.done-btn.on{background:rgba(61,145,66,.12);border-color:var(--green);color:var(--green)}
.done-btn:active{transform:scale(.98)}

/* TODAY BTN */
.today-btn{position:fixed;bottom:22px;right:14px;background:var(--fire);color:#fff;border:none;border-radius:50px;padding:10px 18px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 18px rgba(232,66,26,.45);z-index:200;display:flex;align-items:center;gap:6px;transition:transform .13s}
.today-btn:active{transform:scale(.95)}

/* DELOAD / TAPER BANNER */
.week-banner{padding:8px 14px;font-size:12px;font-weight:500;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.week-banner.deload{background:rgba(107,79,187,.12);color:#a78bfa;border-bottom:1px solid rgba(107,79,187,.2)}
.week-banner.taper{background:rgba(47,111,191,.1);color:#60a5fa;border-bottom:1px solid rgba(47,111,191,.2)}
</style>
</head>

function tcfg(tp){

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function parseEx(text){
  if(!text||text==='—')return'';
  const lines=text.split('\n');
  let html='<div class="exlist">';
  let i=0;
  while(i<lines.length){
    const line=lines[i].trim();
    if(!line){i++;continue;}
    const lm=line.match(/^([A-H])\)\s*(.*)/);
    if(lm){
      let ltr=lm[1],cnt=esc(lm[2]);
      i++;
      while(i<lines.length){
        const nx=lines[i];
        if(/^[A-H]\)/.test(nx.trim()))break;
        if(/^[⏱🔥━🏁🏆🥇]/.test(nx.trim())&&!nx.startsWith(' '))break;
        cnt+='<br>'+esc(nx);
        i++;
      }
      const isStair=cnt.includes('SCHODY')||cnt.includes('★');
      const isSpec=cnt.includes('🧗')||cnt.includes('🦋');
      const lColor=isStair?'var(--fire)':isSpec?'var(--green)':'var(--muted)';
      const bodyClass=isStair?'ex-hl':isSpec?'ex-green':'extxt';
      html+=`<div class="exrow"><div class="exltr" style="color:${lColor}">${ltr}</div><div class="${bodyClass}">${cnt}</div></div>`;
    } else if(line.includes('━━')||line.startsWith('🔥 CF')){
      // CF block - collect until end
      let blk='';
      while(i<lines.length){
        const nl=lines[i];
        if(nl.trim()===''&&blk.includes('→')){i++;break;}
        blk+=esc(nl)+'<br>';
        i++;
      }
      html+=`<div class="ex-cf">${blk}</div>`;
    } else if(line.startsWith('⏱️')||line.startsWith('⏱')){
      let blk=esc(line)+'<br>';
      i++;
      while(i<lines.length&&(lines[i].startsWith(' ')||lines[i].startsWith('→'))){
        blk+=esc(lines[i])+'<br>';i++;
      }
      html+=`<div class="ex-hiit">${blk}</div>`;
    } else if(line.match(/^[🏆🏁🥇🔬]/)){
      let blk=esc(line)+'<br>';
      i++;
      while(i<lines.length&&lines[i].trim()!==''){
        blk+=esc(lines[i])+'<br>';i++;
      }
      html+=`<div class="ex-cf" style="border-color:rgba(245,166,35,.4);color:#d4a843">${blk}</div>`;
    } else {
      html+=`<div class="stxt">${esc(line)}</div>`;i++;
    }
  }
  return html+'</div>';
}

function parseRpe(text){
  if(!text||text==='—')return'';
  const lines=text.split('\n');
  let html='<div class="rpelist">';
  for(const line of lines){
    if(!line.trim())continue;
    const lm=line.match(/^([A-H⏱★✓\/\.]+)\)?\s*(.*)/);
    let ltr='',cnt=lm&&lm[1].length<=4?lm[2]:line;
    if(lm&&lm[1].length<=4)ltr=lm[1];
    cnt=esc(cnt).replace(/RPE\s*(\d+(?:[–\-]\d+)?)/g,(_,n)=>{
      const v=parseInt(n);
      const c=v>=10?'rp10':v>=9?'rp9':v>=8?'rp8':v>=7?'rp7':'rplo';
      return`<span class="rp ${c}">RPE ${n}</span>`;
    });
    html+=`<div class="rperow"><div class="rpeltr">${ltr?ltr+')':''}</div><div>${cnt}</div></div>`;
  }
  return html+'</div>';
}

    let ri='💤';
    for(const[k2,v] of Object.entries(icons))if(tp.toUpperCase().includes(k2))ri=v;
    b.innerHTML=`<div class="restday">
      <div class="rest-ico">${ri}</div>
      <div class="rest-t">${tp}</div>
      <div class="rest-s">${d.ex||'Pełny odpoczynek · dobry sen · regeneracja'}</div>
    </div>`;
    return;
  }

  // Type banner
  html+=`<div class="typebanner" style="background:${col}18;border-color:${col}">
    <div class="tb-icon">${ico}</div>
    <div class="tb-txt" style="color:${col}">${tp}</div>
  </div>`;

  if(isComp){
    const ex=d.ex||'';
    html+=`<div class="compcard">
      <div class="comp-t">🏆 Dzień startowy</div>
      <div style="font-size:13px;color:#bbb;line-height:1.75">${esc(ex).replace(/\n/g,'<br>')}</div>
    </div>`;
  } else {
    const uid=`${cw}-${cd}`;
    if(d.wu) html+=card('wu'+uid,'🌡️','Rozgrzewka',`<div class="stxt">${esc(d.wu).replace(/\n/g,'<br>').replace(/→/g,'<span style="color:var(--fire)">→</span>')}</div>`,true);
    if(d.ex) html+=card('ex'+uid,'💪','Trening główny',parseEx(d.ex),true);
    if(d.rp&&d.rp!=='—') html+=card('rp'+uid,'⏱️','Przerwy & RPE',parseRpe(d.rp),false);
    if(d.cd) html+=card('cd'+uid,'❄️','Schłodzenie',`<div class="stxt">${esc(d.cd).replace(/\n/g,'<br>')}</div>`,false);
  }

  const isDone=done[k];
  html+=`<button class="done-btn${isDone?' on':''}" id="db-${k}" onclick="togDone('${k}')">
    ${isDone?'✅ Trening zaliczony':'☐ Oznacz jako wykonany'}
  </button>`;

  b.innerHTML=html;
}

function updatePg(){
  const p=((cw+1)/16*100).toFixed(1);
  document.getElementById('pgfill').style.width=p+'%';
  document.getElementById('pglbl').textContent=`${cw+1}/16 tygodni · ${Math.round(p)}% sezonu`;
}

selWeek(0,0);
</script>
</body>
