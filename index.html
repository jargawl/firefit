  body{margin:0;background:var(--bg);color:var(--text);

       padding-bottom:60px;}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#14171A,#181C20 85%);
         padding:14px 16px 10px;border-bottom:1px solid var(--line);}
  header h1{margin:0 0 2px;font-size:19px;letter-spacing:.5px;font-weight:800;
             text-transform:uppercase;}
  header h1 span{color:var(--ember);}
  header .tag{font-size:11.5px;color:var(--sub);margin-bottom:10px;}
  .toolbar{display:flex;gap:8px;}
  .toolbar input{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--text);
                 padding:9px 12px;border-radius:9px;font-size:14px;}
  .toolbar button{background:var(--ember);color:#fff;border:none;border-radius:9px;
                  padding:9px 14px;font-size:13px;font-weight:700;white-space:nowrap;}
  .progress-wrap{margin-top:10px;height:5px;border-radius:3px;background:var(--card2);overflow:hidden;}
  .progress-bar{height:100%;background:var(--ember);width:0%;transition:width .3s;}
  main{padding:10px 12px 0;}
  .week{margin-top:18px;}
  .week h2{font-size:16px;margin:0 0 1px;font-weight:800;letter-spacing:.3px;}
  .week .sub{font-size:11.5px;color:var(--sub);font-style:italic;margin-bottom:8px;}
  .day{border-radius:12px;margin-bottom:10px;overflow:hidden;border:1px solid var(--line);
       background:var(--card);}
  .day.today{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember);}
  .day-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;
            cursor:pointer;gap:8px;}
  .day-head .badge{font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:3px 7px;
                    border-radius:5px;color:#fff;flex-shrink:0;}
  .badge.sil{background:var(--sil);} .badge.tor{background:var(--tor);}
  .badge.reg{background:var(--reg);} .badge.odp{background:var(--odp);}
  .badge.zaw{background:var(--zaw);} .badge.inne{background:var(--gray);}
  .day-head .htext{font-size:13.3px;font-weight:700;flex:1;line-height:1.3;}
  .day-head .chev{color:var(--sub);transition:transform .2s;font-size:12px;}
  .day.open .chev{transform:rotate(90deg);}
  .day-head .today-pill{font-size:9px;background:var(--ember);color:#fff;font-weight:800;
                         padding:2px 6px;border-radius:20px;letter-spacing:.4px;}
  .day-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .day.open .day-body{max-height:4000px;}
  .day-body-inner{padding:2px 13px 12px;}
  .blok-title{font-size:11.5px;font-weight:800;color:var(--ember);text-transform:uppercase;
              letter-spacing:.3px;margin:10px 0 3px;}
  .ex{display:flex;gap:8px;padding:6px 0;border-top:1px solid #2b3239;}
  .ex:first-of-type{border-top:none;}
  .ex input[type=checkbox]{margin-top:2px;width:17px;height:17px;accent-color:var(--ember);
                            flex-shrink:0;}
  .ex-text{flex:1;font-size:13.3px;line-height:1.35;}
  .ex-text.done .main{opacity:.4;text-decoration:line-through;}
  .ex-text .main b{font-weight:700;}
  .ex-text .meta{color:var(--sub);font-size:12px;}
  .ex-text .uwagi{color:var(--gold);font-size:11.8px;font-style:italic;margin-top:2px;}
  .ex-text .newtag{display:inline-block;background:var(--ember-dim);color:#ffcbb8;
                    font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;
                    margin-left:5px;letter-spacing:.3px;vertical-align:middle;}
  .empty-msg{text-align:center;color:var(--sub);padding:40px 10px;font-size:13px;}
  footer{text-align:center;color:var(--sub);font-size:11px;padding:18px 20px 30px;}
</style>
</head>

const TODAY_MMDD = "07-08";
const STORE_KEY = 'firefit_done_v1';
let done = {};
try { done = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e){ done = {}; }

function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(done)); }catch(e){} updateProgress(); }

function updateProgress(){
  let total=0, doneCount=0;
  document.querySelectorAll('.ex input[type=checkbox]').forEach(cb=>{
    total++; if(cb.checked) doneCount++;
  });
  const pct = total? Math.round(doneCount/total*100) : 0;
  document.getElementById('progressBar').style.width = pct+'%';
}

function render(filter){
  const main = document.getElementById('main');
  main.innerHTML = '';
  let anyMatch = false;
  DATA.forEach((week, wi)=>{
    const weekEl = document.createElement('div');
    weekEl.className = 'week';
    const daysHtml = [];
    week.days.forEach((day, di)=>{
      const dayId = 'd'+wi+'_'+di;
      let rowsHtml = '';
      let lastBlok = null;
      let dayMatches = !filter;
      day.rows.forEach((row, ri)=>{
        const hay = (row.blok+' '+row.cwicz+' '+row.uwagi).toLowerCase();
        const matches = !filter || hay.includes(filter);
        if(matches) dayMatches = true;
        if(filter && !matches) return;
        if(row.blok && row.blok !== lastBlok){
          rowsHtml += `<div class="blok-title">${row.blok}</div>`;
          lastBlok = row.blok;
        }
        const exId = dayId+'_'+ri;
        const checked = done[exId] ? 'checked' : '';
        const doneClass = done[exId] ? 'done' : '';
        const metaBits = [row.serie, row.ciezar, row.przerwa].filter(x=>x && x!=='—');
        const metaStr = metaBits.length ? ' — '+metaBits.join(' • ') : '';
        const newTag = row.nowe ? '<span class="newtag">NOWE</span>' : '';
        rowsHtml += `<div class="ex">
          <input type="checkbox" data-id="${exId}" ${checked}>
          <div class="ex-text ${doneClass}">
            <div class="main"><b>${row.cwicz}</b>${metaStr}${newTag}</div>
            ${row.uwagi ? `<div class="uwagi">↳ ${row.uwagi}</div>` : ''}
          </div>
        </div>`;
      });
      if(!dayMatches) return;
      anyMatch = true;
      const isToday = day.date === TODAY_MMDD;
      daysHtml.push(`
      <div class="day ${isToday?'today':''} ${filter?'open':''}" id="${dayId}">
        <div class="day-head" onclick="this.parentElement.classList.toggle('open')">
          <span class="badge ${day.session}">${day.session.toUpperCase()}</span>
          <span class="htext">${day.header}</span>
          ${isToday?'<span class="today-pill">DZIŚ</span>':''}
          <span class="chev">&#9656;</span>
        </div>
        <div class="day-body"><div class="day-body-inner">${rowsHtml}</div></div>
      </div>`);
    });
    if(daysHtml.length===0) return;
    weekEl.innerHTML = `<h2>${week.title}</h2><div class="sub">${week.subtitle}</div>` + daysHtml.join('');
    main.appendChild(weekEl);
  });
  if(!anyMatch){
    main.innerHTML = '<div class="empty-msg">Brak wyników dla podanej frazy.</div>';
  }
  main.querySelectorAll('.ex input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const id = e.target.dataset.id;
      done[id] = e.target.checked;
      e.target.closest('.ex').querySelector('.ex-text').classList.toggle('done', e.target.checked);
      save();
    });
  });
  updateProgress();
}

document.getElementById('search').addEventListener('input', e=>{
  render(e.target.value.trim().toLowerCase());
});
document.getElementById('todayBtn').addEventListener('click', ()=>{
  document.getElementById('search').value='';
  render('');
  const todayEl = document.querySelector('.day.today');
  if(todayEl){ todayEl.classList.add('open'); todayEl.scrollIntoView({behavior:'smooth', block:'start'}); }
});

render('');
const todayEl = document.querySelector('.day.today');
if(todayEl){ todayEl.classList.add('open'); setTimeout(()=>todayEl.scrollIntoView({block:'start'}),50); }
</script>
